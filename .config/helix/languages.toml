# Astro
[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = {typescript = {tsdk = "/Users/user/.bun/install/global/node_modules/typescript/lib"}, environment = "node"}

[[language]]
name = "astro"
auto-format = true
language-servers = [ "astro-ls" ]

# Swift
[[language]]
name = "swift"
formatter = { command = "swift-format", args = ["format"] }
auto-format = true
roots = []
