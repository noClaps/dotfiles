#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "noClaps"
email = "git@zerolimits.dev"

[ui]
default-command = "log"
editor = "zed --wait"
paginate = "never"
diff-editor = ":builtin"

[signing]
behavior = "own"
backend = "ssh"
key = "/Users/user/.ssh/id_ed25519.pub"

[git]
sign-on-push = true
colocate = true

[snapshot]
max-new-file-size = 0

[aliases]
advance = ["bookmark", "move", "main", "--to", "@-"]
